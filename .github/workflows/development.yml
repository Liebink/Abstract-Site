name: Development

on:
  push:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  composer85:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - uses: actions/checkout@v4
      - name: Cache vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-composer85
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
  phpstan85:
    runs-on: ubuntu-latest
    needs: [ composer85 ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-composer85
      - run: ./vendor/bin/phpstan analyse -c phpstan.neon --memory-limit 200M
  phpcs85:
    runs-on: ubuntu-latest
    needs: [ composer85 ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-composer85
      - run: ./vendor/bin/phpcs --standard=./phpcs.xml
  psalm85:
    runs-on: ubuntu-latest
    needs: [ composer85 ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-composer85
      - run: ./vendor/bin/psalm
